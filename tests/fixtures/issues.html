<!doctype html><meta charset="utf-8"><title>Attach issue probe</title>
<style>
body{margin:0;height:2200px}button{height:36px}#shadow-host{position:absolute;left:30px;top:25px}
#frame-scroll{position:absolute;left:50px;top:180px;width:650px;height:280px;overflow:auto;border:7px solid #333}
#frame-spacer{height:180px}iframe{display:block;width:500px;height:360px;border:9px solid #555;transform-origin:0 0}
#offscreen{position:absolute;left:30px;top:1600px;width:160px;height:80px;background:rgb(0,180,0)}
#clip{position:absolute;left:750px;top:150px;width:100px;height:80px;overflow:auto}
#clipped{margin-top:200px;width:90px;height:60px;background:rgb(0,0,200)}
</style>
<div id="shadow-host"></div>
<button id="covered" style="position:absolute;left:260px;top:25px">Covered button</button>
<div id="overlay" style="position:absolute;left:255px;top:20px;width:160px;height:50px;z-index:99;background:white">Loading overlay</div>
<select id="hidden-select" hidden><option value="a">Alpha</option><option value="b">Beta</option></select>
<select id="disabled-select" hidden disabled><option value="a">Alpha</option><option value="b">Beta</option></select>
<div inert><select id="inert-select" hidden><option>Alpha</option><option>Beta</option></select></div>
<div id="frame-scroll"><div id="frame-spacer"></div><iframe id="same-frame" title="Issue frame" src="/issue-frame"></iframe><div style="height:200px"></div></div>
<input id="street" aria-label="Street" style="position:absolute;left:30px;top:90px">
<input id="zip" aria-label="Zip" style="position:absolute;left:230px;top:90px">
<input id="upload" type="file" hidden>
<div id="offscreen">Offscreen evidence</div><div id="clip"><div id="clipped">Clipped evidence</div></div>
<script>
window.selectEvents=[];document.querySelector('#hidden-select').addEventListener('change',e=>selectEvents.push({value:e.target.value,trusted:e.isTrusted}));
window.shadowClicks=[];
const root=document.querySelector('#shadow-host').attachShadow({mode:'closed'});window.issueShadow=root;
root.innerHTML='<button id="cp_form_submit_i">Shadow submit</button>';
root.querySelector('button').onclick=e=>shadowClicks.push({trusted:e.isTrusted,activation:navigator.userActivation.isActive});
document.querySelector('#upload').onchange=()=>{
  sessionStorage.uploadChanges=String(Number(sessionStorage.uploadChanges||0)+1);
  setTimeout(()=>location.reload(),40);
};
</script>
