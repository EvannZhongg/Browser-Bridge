[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-browser-bridge"
version = "0.1.0"
description = "Control existing Chrome and Edge tabs through a local extension and MCP"
requires-python = ">=3.11"
dependencies = ["aiohttp==3.13.3", "mcp==1.26.0", "cryptography>=44", "pydantic>=2.11,<2.13", "pydantic-settings>=2.5,<2.14"]

[project.scripts]
browser-bridge = "browser_bridge.setup:main"

[tool.setuptools.packages.find]
include = ["browser_bridge*"]
